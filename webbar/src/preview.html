<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>webbar preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: sans-serif;
      }
      #desktop {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, #1e293b 0%, #0f172a 55%, #1e1b4b 100%);
      }
      .icon {
        position: absolute;
        width: 72px;
        text-align: center;
        color: #e2e8f0;
        font-size: 12px;
        text-shadow: 0 1px 3px rgba(0,0,0,.6);
      }
      .icon .glyph {
        width: 40px;
        height: 40px;
        margin: 0 auto 4px;
        border-radius: 8px;
        background: rgba(255,255,255,.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .window {
        position: absolute;
        border-radius: 10px;
        background: #171717ee;
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 20px 50px rgba(0,0,0,.5);
        overflow: hidden;
      }
      .window .titlebar {
        height: 30px;
        background: #262626;
        display: flex;
        align-items: center;
        padding: 0 10px;
        gap: 6px;
        color: #a3a3a3;
        font-size: 12px;
      }
      .window .dot { width: 10px; height: 10px; border-radius: 50%; }
      .window .body {
        padding: 16px;
        color: #737373;
        font-size: 13px;
      }
      #bar-frame {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 40px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="desktop">
      <div class="icon" style="top:24px; left:24px;">
        <div class="glyph">📁</div>
        Proyectos
      </div>
      <div class="icon" style="top:110px; left:24px;">
        <div class="glyph">🗑️</div>
        Papelera
      </div>

      <div class="window" style="top:60px; left:220px; width:520px; height:340px;">
        <div class="titlebar">
          <span class="dot" style="background:#ef4444;"></span>
          <span class="dot" style="background:#eab308;"></span>
          <span class="dot" style="background:#22c55e;"></span>
          <span>Obsidian</span>
        </div>
        <div class="body">contenido de ventana simulado…</div>
      </div>

      <div class="window" style="top:140px; left:640px; width:460px; height:300px;">
        <div class="titlebar">
          <span class="dot" style="background:#ef4444;"></span>
          <span class="dot" style="background:#eab308;"></span>
          <span class="dot" style="background:#22c55e;"></span>
          <span>Konsole</span>
        </div>
        <div class="body">contenido de ventana simulado…</div>
      </div>
    </div>

    <iframe id="bar-frame" src="./index.html"></iframe>
  </body>
</html>
